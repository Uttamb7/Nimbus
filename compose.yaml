x-env: &env
  PORT: 8080
  DEMO_MODE: "true"
  ADMIN_TOKEN: local-nimbus

x-service: &service
  build: .
  restart: unless-stopped
  environment: *env
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.PORT+'/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
    interval: 2s
    timeout: 2s
    retries: 15
    start_period: 3s

services:
  control-plane:
    <<: *service
    environment: { <<: *env, SERVICE_NAME: control-plane, PORT: 4000, AUTH_TOKENS: "local-viewer:viewer:viewer,local-operator:operator:operator,local-admin:admin:Uttamb7", DATABASE_URL: "postgresql://nimbus:nimbus-local@postgres:5432/nimbus" }
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment: { POSTGRES_DB: nimbus, POSTGRES_USER: nimbus, POSTGRES_PASSWORD: nimbus-local }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nimbus -d nimbus"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s
    volumes: [nimbus-postgres:/var/lib/postgresql/data]
  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment: { RABBITMQ_DEFAULT_USER: nimbus, RABBITMQ_DEFAULT_PASS: nimbus-local }
    ports: ["15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes: [nimbus-rabbitmq:/var/lib/rabbitmq]
  gateway:
    <<: *service
    environment:
      <<: *env
      SERVICE_NAME: gateway
      PORT: 8080
      IDENTITY_URL: http://identity-api:8080
      ORDER_URL: http://order-orchestrator:8080
      TELEMETRY_URL: http://control-plane:4000/observe
      FAULT_STATUS: ${GATEWAY_FAULT_STATUS:-}
    ports: ["8080:8080"]
    depends_on: [identity-api, order-orchestrator]
  identity-api:
    <<: *service
    environment: { <<: *env, SERVICE_NAME: identity-api, TELEMETRY_URL: http://control-plane:4000/observe, FAULT_STATUS: "${IDENTITY_FAULT_STATUS:-}" }
  inventory-api:
    <<: *service
    environment: { <<: *env, SERVICE_NAME: inventory-api, TELEMETRY_URL: http://control-plane:4000/observe, FAULT_STATUS: "${INVENTORY_FAULT_STATUS:-}" }
  order-orchestrator:
    <<: *service
    environment:
      <<: *env
      SERVICE_NAME: order-orchestrator
      PORT: 8080
      INVENTORY_URL: http://inventory-api:8080
      BROKER_URL: amqp://nimbus:nimbus-local@rabbitmq:5672?heartbeat=5
      TELEMETRY_URL: http://control-plane:4000/observe
      DATABASE_URL: postgresql://nimbus:nimbus-local@postgres:5432/nimbus
      FAULT_STATUS: ${ORDER_FAULT_STATUS:-}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      inventory-api: { condition: service_started }
  payment-worker:
    <<: *service
    environment: { <<: *env, SERVICE_NAME: payment-worker, TELEMETRY_URL: http://control-plane:4000/observe, DATABASE_URL: "postgresql://nimbus:nimbus-local@postgres:5432/nimbus", BROKER_URL: "amqp://nimbus:nimbus-local@rabbitmq:5672?heartbeat=5", FAULT_STATUS: "${PAYMENT_FAULT_STATUS:-}" }
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
  notification-router:
    <<: *service
    environment: { <<: *env, SERVICE_NAME: notification-router, TELEMETRY_URL: http://control-plane:4000/observe, DATABASE_URL: "postgresql://nimbus:nimbus-local@postgres:5432/nimbus", BROKER_URL: "amqp://nimbus:nimbus-local@rabbitmq:5672?heartbeat=5", FAULT_STATUS: "${NOTIFICATION_FAULT_STATUS:-}" }
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
  analytics-ingestor:
    <<: *service
    environment: { <<: *env, SERVICE_NAME: analytics-ingestor, TELEMETRY_URL: http://control-plane:4000/observe, DATABASE_URL: "postgresql://nimbus:nimbus-local@postgres:5432/nimbus", BROKER_URL: "amqp://nimbus:nimbus-local@rabbitmq:5672?heartbeat=5", FAULT_STATUS: "${ANALYTICS_FAULT_STATUS:-}" }
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

volumes:
  nimbus-postgres:
  nimbus-rabbitmq:
