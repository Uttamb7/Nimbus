name: Canary verification

on:
  workflow_dispatch:
    inputs:
      stable_image:
        description: Stable Nimbus GHCR full commit-SHA tag or digest
        required: true
        type: string
      candidate_image:
        description: Candidate Nimbus GHCR full commit-SHA tag or digest
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compare isolated images
        env:
          STABLE_IMAGE: ${{ inputs.stable_image }}
          CANDIDATE_IMAGE: ${{ inputs.candidate_image }}
        run: node scripts/canary.js
      - name: Ensure both stacks are removed
        if: always()
        run: node scripts/canary.js --cleanup
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: canary-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: canary-results/
          if-no-files-found: error
          retention-days: 14
